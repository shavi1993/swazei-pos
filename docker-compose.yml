services:
  postgres:
    image: postgres:16
    container_name: swazei-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: swazei_pos
    ports:
      - "5432:5432"
    volumes:
      - swazei_pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: swazei-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
volumes:
  swazei_pgdata:
